<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1302px" preserveAspectRatio="none" style="width:396px;height:1302px;background:#FFFFFF;" version="1.1" viewBox="0 0 396 1302" width="396px" zoomAndPan="magnify"><title>Tessera - normaliseLayout invariant pipeline</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="353.1309" x="20" y="32.9951">Tessera - normaliseLayout invariant pipeline</text></g><ellipse cx="190.0654" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.8926" x="92.1191" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.8926" x="102.1191" y="108.4355">Input: items, specs, columns,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.918" x="102.1191" y="122.4043">options.pin, config</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="234.5234" x="72.8037" y="155.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.5234" x="82.8037" y="176.373">Drop instances with unknown types</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.752" x="56.1895" y="209.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.752" x="66.1895" y="230.3418">Drop duplicate ids (first occurrence wins)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="289.625" x="45.2529" y="263.1719"/><text fill="#00000